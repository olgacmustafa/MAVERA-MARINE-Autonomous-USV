/**:
  ros__parameters:
    plugin_denylist: []
    plugin_allowlist:
      - mavlink
      - sys_status
      - local_position
      - global_position
      - imu
      - param
      - command
      # /mavros/rc/in -> uzaktan E-Stop (CH9)
      - rc_io
      # /mavros/setpoint_raw/local -> Cube'a hız/yaw-rate komutu
      - setpoint_raw
      # /mavros/mission/waypoints -> Mission Planner görev listesi
      - waypoint
      # FCU/ROS zaman damgalarının tutarlı kalması
      - sys_time

/mavros/local_position:
  ros__parameters:
    frame_id: "odom"
    tf:
      send: true
      frame_id: "odom"
      child_frame_id: "base_link"

/mavros/global_position:
  ros__parameters:
    tf:
      send: false
