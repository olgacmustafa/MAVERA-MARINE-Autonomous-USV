/zed/zed_node:
  ros__parameters:
    general:
      # Full launch yükünde USB/GPU baskısını azaltmak için 15 Hz grab,
      # YOLO kontrol döngüsüyle uyumlu 10 Hz yayın.
      grab_resolution: "HD720"
      grab_frame_rate: 15
      pub_resolution: "CUSTOM"
      pub_downscale_factor: 2.0
      pub_frame_rate: 10.0
      enable_image_validity_check: 1
      async_image_retrieval: false

    depth:
      depth_mode: "NEURAL_LIGHT"
      min_depth: 0.3
      max_depth: 10.0
      # MAVROS pose kullanıldığı için ZED positional tracking'i zorla başlatma.
      depth_stabilization: 0

    pos_tracking:
      pos_tracking_enabled: false
      publish_tf: false
      publish_map_tf: false
      area_memory: false
      save_area_memory_on_closing: false

    mapping:
      mapping_enabled: false

    object_detection:
      od_enabled: false

    body_tracking:
      bt_enabled: false
